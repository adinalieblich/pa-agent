name: Deploy to AWS Lambda

on:
  # Auto-deploy on every push to main
  push:
    branches: [main]
    # Skip if only docs/mockups/scripts changed (saves minutes)
    paths-ignore:
      - 'docs/**'
      - 'scripts/**'
      - '*.md'
      - '.gitignore'
      - 'PA_AGENT_SPEC*'
      - 'PA-AGENT-API.docx'

  # Manual trigger button in GitHub UI
  workflow_dispatch:

# Cancel in-flight deploys when a new one starts on the same branch
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false  # Let in-flight deploys finish to avoid mid-deploy state

jobs:
  deploy:
    name: Build + deploy
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      # ---- Checkout the repo ----
      - name: Checkout
        uses: actions/checkout@v4

      # ---- Python 3.11 (matches Lambda runtime) ----
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ---- Node 20 for the PWA build ----
      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: pwa-v2/package-lock.json

      # ---- AWS SAM CLI ----
      - name: Setup AWS SAM CLI
        uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      # ---- AWS credentials from GitHub Secrets ----
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-2

      # ---- Build the React/Vite PWA ----
      - name: Build PWA
        working-directory: pwa-v2
        run: |
          npm ci
          npm run build

      # ---- SAM build (Python deps + package source) ----
      - name: SAM build
        working-directory: infra/sam
        run: sam build

      # ---- Trim Lambda zip ----
      # SAM packages everything under CodeUri by default. We strip stuff
      # that has no business being in the runtime: node_modules, source
      # files Vite already compiled away, docx specs, tests, logs.
      - name: Trim Lambda bundle
        working-directory: infra/sam
        run: |
          for bd in WebhookFunction NagTickFunction; do
            for p in \
              pwa-v2/node_modules \
              pwa-v2/src \
              pwa-v2/public \
              pwa-v2/package.json \
              pwa-v2/package-lock.json \
              pwa-v2/vite.config.js \
              pwa-v2/index.html \
              CLAUDE_CODE_INSTRUCTIONS.md \
              PA-AGENT-API.docx \
              PA_AGENT_SPEC.md \
              PA_AGENT_SPEC_v3.md \
              files.zip \
              tests \
              logs \
              docs \
              scripts; do
              rm -rf ".aws-sam/build/$bd/$p" || true
            done
            echo "Trimmed $bd → $(du -sh .aws-sam/build/$bd | cut -f1)"
          done

      # ---- Deploy the stack ----
      - name: SAM deploy
        working-directory: infra/sam
        run: |
          sam deploy \
            --no-confirm-changeset \
            --resolve-s3 \
            --capabilities CAPABILITY_IAM \
            --no-fail-on-empty-changeset

      # ---- Print the live URLs at the end of the run ----
      - name: Show deployed URLs
        working-directory: infra/sam
        run: |
          echo "## Deployed ✅" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          sam list stack-outputs --output json | \
            python -c "
          import json, sys
          data = json.load(sys.stdin)
          for o in data:
              print(f\"- **{o['OutputKey']}**: {o['OutputValue']}\")" \
            >> $GITHUB_STEP_SUMMARY
